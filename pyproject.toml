[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-layout"
version = "0.1.0"
description = "Design 96/384-well plate layouts with replicates and controls; export CSV and ASCII maps."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
plate-layout = "plate_layout.cli:main"

[tool.setuptools]
packages = ["plate_layout"]
